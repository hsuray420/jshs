name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test and build
        run: pnpm test

      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure ECPay production secrets
        env:
          ECPAY_MERCHANT_ID: ${{ secrets.ECPAY_MERCHANT_ID }}
          ECPAY_HASH_KEY: ${{ secrets.ECPAY_HASH_KEY }}
          ECPAY_HASH_IV: ${{ secrets.ECPAY_HASH_IV }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$ECPAY_MERCHANT_ID" | pnpm exec wrangler secret put ECPAY_MERCHANT_ID
          printf '%s' "$ECPAY_HASH_KEY" | pnpm exec wrangler secret put ECPAY_HASH_KEY
          printf '%s' "$ECPAY_HASH_IV" | pnpm exec wrangler secret put ECPAY_HASH_IV
